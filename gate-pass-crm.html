function buildInitialState() {
  const companies = [];
  const companyId = new Map();
  const collectors = [];
  const collectorId = new Map();
  const gatePasses = [];

  for (const r of SEED_GATE_PASSES) {
    if (!companyId.has(r.company)) {
      const id = companies.length + 1;
      companyId.set(r.company, id);
      companies.push({ id, name: r.company, sector: COMPANY_SECTORS[r.company] || null, contact: null, phone: null, email: null, notes: null });
    }
    if (r.collectedBy && !collectorId.has(r.collectedBy)) {
      const id = collectors.length + 1;
      collectorId.set(r.collectedBy, id);
      collectors.push({ id, name: r.collectedBy, phone: null, email: null, active: true });
    }
  }

  let gid = 1;
  for (const r of SEED_GATE_PASSES) {
    gatePasses.push({
      id: gid++,
      number: r.number,
      companyId: companyId.get(r.company),
      requestType: r.requestType,
      submittedBy: r.submittedBy,
      submissionAt: r.submissionAt,
      collectorId: r.collectedBy ? collectorId.get(r.collectedBy) : null,
      collectionAt: r.collectionAt,
      status: r.status.toUpperCase(),
      remarks: r.remarks || null
    });
  }

  return {
    companies, collectors, gatePasses,
    nextIds: { company: companies.length + 1, collector: collectors.length + 1, gatePass: gatePasses.length + 1 }
  };
}

  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function companyName(id) { const c = DB.companies.find((x) => x.id === id); return c ? c.name : "—"; }

function fmtDateTime(iso) {

  return d.toLocaleString(undefined, { year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "2-digit" });
}
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

const HOUR_MS = 3600000, DAY_MS = HOUR_MS * 24;
function processingHours(gp) {
  if (!gp.collectionAt) return null;
  return (new Date(gp.collectionAt) - new Date(gp.submissionAt)) / HOUR_MS;
}
function daysWaiting(gp, now = new Date()) { return (now - new Date(gp.submissionAt)) / DAY_MS; }
function delayCategory(gp, now = new Date()) {
  if (gp.status === "CANCELLED") return "Annulé";
  if (gp.status === "PENDING") return daysWaiting(gp, now) > 2 ? "Overdue (>48h)" : "En attente";
  const h = processingHours(gp) ?? 0;
  if (h <= 24) return "Rapide (≤24h)";
  if (h <= 48) return "Normal (24-48h)";
  return "Lent (>48h)";
}
function priority(gp, now = new Date()) { return daysWaiting(gp, now) > 1 ? "Haute" : "Basse"; }
function formatDuration(hours) {
  if (hours === null || hours === undefined) return "—";
  if (hours < 1) return `${Math.round(hours * 60)} min`;
  const days = Math.floor(hours / 24);
  const rem = hours - days * 24;
  if (days > 0) return `${days}j ${rem.toFixed(1)}h`;
  return `${hours.toFixed(1)}h`;
}
function pillFor(text) {
  const map = {

  };
  const cls = map[text] || "pill-mute";
  const label = text === "PENDING" ? "Pending" : text === "COLLECTED" ? "Collected" : text === "CANCELLED" ? "Cancelled" : text;
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}

function computeKpis(rows, now = new Date()) {
  const total = rows.length;
  const collected = rows.filter((g) => g.status === "COLLECTED");
  const pending = rows.filter((g) => g.status === "PENDING");
  const cancelled = rows.filter((g) => g.status === "CANCELLED");
  const times = collected.map((g) => processingHours(g)).filter((h) => h !== null);
  const avg = times.length ? times.reduce((a, b) => a + b, 0) / times.length : 0;
  const fastest = times.length ? Math.min(...times) : null;
  const longest = times.length ? Math.max(...times) : null;

  const sod = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = (sod.getDay() + 6) % 7;
  const sow = new Date(sod); sow.setDate(sow.getDate() - dow);
  const som = new Date(now.getFullYear(), now.getMonth(), 1);
  const soy = new Date(now.getFullYear(), 0, 1);

  const cAt = (g) => new Date(g.collectionAt);
  return {
    total, collected: collected.length, pending: pending.length, cancelled: cancelled.length,
    collectionRate: total ? collected.length / total : 0,
    avgHours: avg, fastestHours: fastest, longestHours: longest,
    today: collected.filter((g) => cAt(g) >= sod).length,
    week: collected.filter((g) => cAt(g) >= sow).length,
    month: collected.filter((g) => cAt(g) >= som).length,
    year: collected.filter((g) => cAt(g) >= soy).length
  };
}
function computeStatusDistribution(rows) {
  return [
    { name: "Collected", value: rows.filter((g) => g.status === "COLLECTED").length, color: "var(--good)" },
    { name: "Pending", value: rows.filter((g) => g.status === "PENDING").length, color: "var(--warning-ink)" },
    { name: "Cancelled", value: rows.filter((g) => g.status === "CANCELLED").length, color: "var(--muted)" }
  ];
}
function seriesBuckets(rows, unit, count, now = new Date()) {
  const out = [];
  if (unit === "day") {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (count - 1));
    for (let i = 0; i < count; i++) {
      const d0 = new Date(start); d0.setDate(d0.getDate() + i);
      const d1 = new Date(d0); d1.setDate(d1.getDate() + 1);
      out.push(bucket(rows, d0, d1, d0.toLocaleDateString(undefined, { month: "short", day: "2-digit" })));
    }
  } else if (unit === "week") {
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const dow = (today.getDay() + 6) % 7;
    const thisWeek = new Date(today); thisWeek.setDate(thisWeek.getDate() - dow);
    const start = new Date(thisWeek); start.setDate(start.getDate() - 7 * (count - 1));
    for (let i = 0; i < count; i++) {
      const d0 = new Date(start); d0.setDate(d0.getDate() + i * 7);
      const d1 = new Date(d0); d1.setDate(d1.getDate() + 7);
      out.push(bucket(rows, d0, d1, d0.toLocaleDateString(undefined, { month: "short", day: "2-digit" })));
    }
  } else {
    const start = new Date(now.getFullYear(), now.getMonth() - (count - 1), 1);
    for (let i = 0; i < count; i++) {
      const d0 = new Date(start.getFullYear(), start.getMonth() + i, 1);
      const d1 = new Date(start.getFullYear(), start.getMonth() + i + 1, 1);
      out.push(bucket(rows, d0, d1, d0.toLocaleDateString(undefined, { month: "short", year: "2-digit" })));
    }
  }
  return out;
}
function bucket(rows, d0, d1, label) {
  const submitted = rows.filter((g) => { const d = new Date(g.submissionAt); return d >= d0 && d < d1; }).length;
  const collected = rows.filter((g) => g.collectionAt && (() => { const d = new Date(g.collectionAt); return d >= d0 && d < d1; })()).length;
  return { label, submitted, collected };
}
function computeCollectorPerformance(rows) {
  const collected = rows.filter((g) => g.status === "COLLECTED" && g.collectorId);
  const byC = new Map();
  for (const g of collected) {
    const name = collectorName(g.collectorId);
    const h = processingHours(g);
    if (!byC.has(name)) byC.set(name, []);
    byC.get(name).push(h);
  }
  const total = collected.length;
  const rowsOut = [...byC.entries()].map(([name, times]) => ({
    name, totalCollected: times.length,
    avgHours: times.reduce((a, b) => a + b, 0) / times.length,
    fastestHours: Math.min(...times), longestHours: Math.max(...times),
    share: total ? times.length / total : 0
  }));
  rowsOut.sort((a, b) => b.totalCollected - a.totalCollected);
  return rowsOut.map((r, i) => ({ ...r, rank: i + 1 }));
}
function computePivotByCompanyStatus(rows) {
  const companies = [...new Set(rows.map((g) => companyName(g.companyId)))].sort();
  const statuses = ["CANCELLED", "COLLECTED", "PENDING"];
  const out = companies.map((company) => {
    const counts = {};
    let total = 0;
    for (const s of statuses) {
      const n = rows.filter((g) => companyName(g.companyId) === company && g.status === s).length;
      counts[s] = n; total += n;
    }
    return { company, counts, total };
  });
  const grand = {};
  for (const s of statuses) grand[s] = rows.filter((g) => g.status === s).length;
  return { rows: out, statuses, grand, grandAll: rows.length };
}
function computePivotByCollector(rows) {
  const names = [...new Set(rows.map((g) => collectorName(g.collectorId) || "(unassigned)"))].sort();
  const out = names.map((name) => ({
    name, count: rows.filter((g) => (collectorName(g.collectorId) || "(unassigned)") === name).length
  }));
  out.sort((a, b) => b.count - a.count);
  return out;
}

function renderCompareBars(mount, data) {
  mount.innerHTML = "";

  const w = 420, h = 200, padL = 34, padB = 24, padT = 26, padR = 14;
  const max = Math.max(1, ...data.map((d) => d.value));

  const svg = svgEl("svg", { viewBox: `0 0 ${w} ${h}`, width: "100%", height: "220", role: "img", "aria-label": "Bar chart" });
  // gridlines
  const steps = Math.min(4, Math.max(1, Math.round(max)));
  for (let i = 0; i <= steps; i++) {
    const y = padT + (h - padT - padB) * (1 - i / steps);
    svg.appendChild(svgEl("line", { x1: padL, x2: w - padR, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }));
    const t = svgEl("text", { x: padL - 8, y: y + 3, "text-anchor": "end", "font-size": 9, fill: "var(--muted)", "font-family": "var(--mono)" });
    t.textContent = Math.round(max * (i / steps)); svg.appendChild(t);
  }
  const tip = attachTooltip(wrap);
  data.forEach((d, i) => {
    const barW = bw * 0.46;
    const x = padL + bw * i + (bw - barW) / 2;
    const bh = (h - padT - padB) * (d.value / max);
    const y = h - padB - bh;
    const rect = svgEl("rect", { x, y, width: barW, height: Math.max(bh,1), rx: 4, fill: d.color, class: "bar-mark" });
    rect.addEventListener("mousemove", (e) => {
      const r = wrap.getBoundingClientRect();
      tip.show(e.clientX - r.left, e.clientY - r.top, `<b>${esc(d.label)}</b>: ${d.value}`);
    });
    rect.addEventListener("mouseleave", () => tip.hide());
    svg.appendChild(rect);
    const lbl = svgEl("text", { x: x + barW / 2, y: h - padB + 14, "text-anchor": "middle", "font-size": 10, fill: "var(--ink-2)" });
    lbl.textContent = d.label; svg.appendChild(lbl);
    const val = svgEl("text", { x: x + barW / 2, y: y - 6, "text-anchor": "middle", "font-size": 10.5, fill: "var(--ink)", "font-family": "var(--mono)", "font-weight": 600 });
    val.textContent = d.value; svg.appendChild(val);
  });

}

  const size = 180, r = 62, stroke = 22, cx = size / 2, cy = size / 2;

  const svg = svgEl("svg", { viewBox: `0 0 ${size} ${size}`, width: "180", height: "180" });
  let offset = 0;
  const tip = attachTooltip(wrap);
  data.forEach((d) => {
    const frac = d.value / total;

    const circle = svgEl("circle", {
      cx, cy, r, fill: "none", stroke: d.color, "stroke-width": stroke,
      "stroke-dasharray": `${dash} ${circumf - dash}`,

    });

  const tickEvery = Math.max(1, Math.ceil(n / 7));
  data.forEach((d, i) => {
    if (i % tickEvery === 0 || i === n - 1) {
      const t = svgEl("text", { x: x(i), y: h - padB + 14, "text-anchor": "middle", "font-size": 8.5, fill: "var(--muted)" });
      t.textContent = d.label; svg.appendChild(t);
    }
  });
  function line(key, color) {
    const pts = data.map((d, i) => `${x(i)},${y(d[key])}`).join(" ");
    svg.appendChild(svgEl("polyline", { points: pts, fill: "none", stroke: color, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }
  line("submitted", "var(--cat-blue)");
  line("collected", "var(--good)");
  const tip = attachTooltip(wrap);
  data.forEach((d, i) => {
    ["submitted", "collected"].forEach((key) => {
      const color = key === "submitted" ? "var(--cat-blue)" : "var(--good)";
      const c = svgEl("circle", { cx: x(i), cy: y(d[key]), r: 3, fill: color, class: "dot-mark" });
      c.addEventListener("mousemove", (e) => {
        const r = wrap.getBoundingClientRect();
        tip.show(e.clientX - r.left, e.clientY - r.top, `<b>${esc(d.label)}</b><br>Submitted: ${d.submitted} · Collected: ${d.collected}`);
      });
      c.addEventListener("mouseleave", () => tip.hide());
      svg.appendChild(c);
    });
  });
  wrap.appendChild(svg);
  const legend = document.createElement("div"); legend.className = "chart-legend";
  legend.innerHTML = `<span class="item"><span class="swatch" style="background:var(--cat-blue)"></span>Submitted</span><span class="item"><span class="swatch" style="background:var(--good)"></span>Collected</span>`;
  mount.appendChild(legend);
}

// horizontal categorical bars (collector performance)
function renderHBars(mount, rows) {
  mount.innerHTML = "";
  const colors = ["var(--cat-blue)", "var(--cat-aqua)", "var(--cat-violet)", "var(--cat-magenta)"];
  const wrap = document.createElement("div"); wrap.className = "svg-wrap"; mount.appendChild(wrap);
  const w = 640, rowH = 34, padL = 110, padR = 40, padT = 6;
  const h = padT + rows.length * rowH + 6;
  const max = Math.max(1, ...rows.map((r) => r.totalCollected));
  const svg = svgEl("svg", { viewBox: `0 0 ${w} ${h}`, width: "100%", height: h });
  const tip = attachTooltip(wrap);
  rows.forEach((r, i) => {
    const y = padT + i * rowH;
    const bw = (w - padL - padR) * (r.totalCollected / max);
    const label = svgEl("text", { x: padL - 10, y: y + rowH / 2 + 4, "text-anchor": "end", "font-size": 11, fill: "var(--ink-2)" });
    label.textContent = r.name; svg.appendChild(label);
    const rect = svgEl("rect", { x: padL, y: y + 6, width: Math.max(bw,2), height: rowH - 14, rx: 4, fill: colors[i % colors.length], class: "bar-mark" });
    rect.addEventListener("mousemove", (e) => {
      const rc = wrap.getBoundingClientRect();
      tip.show(e.clientX - rc.left, e.clientY - rc.top, `<b>${esc(r.name)}</b>: ${r.totalCollected} collected`);
    });
    rect.addEventListener("mouseleave", () => tip.hide());
    svg.appendChild(rect);
    const val = svgEl("text", { x: padL + bw + 8, y: y + rowH / 2 + 4, "font-size": 11, "font-family": "var(--mono)", fill: "var(--ink)", "font-weight": 600 });
    val.textContent = r.totalCollected; svg.appendChild(val);
  });
  wrap.appendChild(svg);
}

function filteredGatePasses() {
  const f = trackerFilters;
  return DB.gatePasses
    .slice()
    .sort((a, b) => new Date(b.submissionAt) - new Date(a.submissionAt))
    .filter((g) => {
      if (f.status && g.status !== f.status) return false;
      if (f.companyId && String(g.companyId) !== String(f.companyId)) return false;
      if (f.collectorId && String(g.collectorId || "") !== String(f.collectorId)) return false;
      if (f.search) {
        const hay = `${g.number} ${companyName(g.companyId)} ${g.submittedBy}`.toLowerCase();
        if (!hay.includes(f.search.toLowerCase())) return false;
      }
      return true;
    });
}
function renderTrackerBody() {
  const rows = filteredGatePasses();
  document.querySelector(".page-head p") && (document.querySelector("#view-tracker .page-head p").textContent = `${rows.length} of ${DB.gatePasses.length} gate passes`);
  const body = document.getElementById("trackerBody");
  if (!rows.length) { body.innerHTML = `<tr class="empty-row"><td colspan="11">No gate passes match these filters.</td></tr>`; return; }
  body.innerHTML = rows.map((g) => {
    const hours = processingHours(g);
    return `<tr>
      <td class="mono-cell">${esc(g.number)}</td>
      <td>${esc(companyName(g.companyId))}</td>
      <td>${esc(g.requestType)}</td>
      <td class="mono-cell">${fmtDateTime(g.submissionAt)}</td>
      <td>${esc(collectorName(g.collectorId) || "—")}</td>
      <td class="mono-cell">${fmtDateTime(g.collectionAt)}</td>
      <td>${pillFor(g.status)}</td>

      <td class="num">${hours !== null ? formatDuration(hours) : "—"}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);">${esc(g.remarks || "")}</td>
      <td><div class="actions-cell">
        <button class="btn-link link-edit" data-act="edit" data-id="${g.id}">Edit</button>
        ${g.status === "PENDING" ? `<button class="btn-link link-warn" data-act="cancel" data-id="${g.id}">Cancel</button>` : ""}
        <button class="btn-link link-danger" data-act="delete" data-id="${g.id}">Delete</button>
      </div></td>
    </tr>`;
  }).join("");
  body.querySelectorAll("[data-act]").forEach((btn) => {
    const id = Number(btn.getAttribute("data-id"));
    const act = btn.getAttribute("data-act");
    btn.addEventListener("click", () => {
      if (act === "edit") openGatePassModal(id);
      else if (act === "cancel") cancelGatePass(id);
      else if (act === "delete") deleteGatePass(id);
    });
  });
}
function cancelGatePass(id) {
  const remarks = prompt("Reason for cancellation (optional):") || null;
  const gp = DB.gatePasses.find((g) => g.id === id);
  gp.status = "CANCELLED"; gp.remarks = remarks;
  saveState(); renderAll();

function deleteGatePass(id) {
  if (!confirm("Delete this gate pass? This cannot be undone.")) return;
  DB.gatePasses = DB.gatePasses.filter((g) => g.id !== id);
  saveState(); renderAll();
}

            </div></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById("btnNewCollector").addEventListener("click", () => openCollectorModal(null));
  mount.querySelectorAll("[data-cact]").forEach((btn) => {
    const id = Number(btn.getAttribute("data-id"));
    const act = btn.getAttribute("data-cact");
    btn.addEventListener("click", () => {
      if (act === "edit") openCollectorModal(id);
      else {
        if (DB.gatePasses.some((g) => g.collectorId === id)) { alert("Cannot delete: this collector is still linked to gate passes."); return; }
        if (!confirm("Delete this collector?")) return;
        DB.collectors = DB.collectors.filter((c) => c.id !== id);
        saveState(); renderAll();
      }
    });
  });
}
function openCollectorModal(id) {
  const c = id ? DB.collectors.find((x) => x.id === id) : null;
  const overlay = document.getElementById("overlay"), body = document.getElementById("modalBody");
  body.innerHTML = `
    <div class="kicker">${c ? "Edit record" : "New record"}</div>
    <h2>${c ? `Edit ${esc(c.name)}` : "New Collector"}</h2>
    <form id="cForm" style="margin-top:14px;">

      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:8px;">
        <input type="checkbox" id="cActive" ${!c || c.active ? "checked" : ""}> Active
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>`;
  overlay.classList.add("open");
  document.getElementById("cCancelBtn").addEventListener("click", closeModal);
  document.getElementById("cForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const rec = { name: document.getElementById("cName").value.trim(), phone: document.getElementById("cPhone").value.trim() || null, email: document.getElementById("cEmail").value.trim() || null, active: document.getElementById("cActive").checked };
    if (c) Object.assign(c, rec); else DB.collectors.push({ id: DB.nextIds.collector++, ...rec });
    saveState(); closeModal(); renderAll();
  });
}

/* ---- analytics / pivot ---- */
function renderAnalytics() {
  const mount = document.getElementById("view-analytics");
  const rows = DB.gatePasses;
  const byCompany = computePivotByCompanyStatus(rows);
  const byCollector = computePivotByCollector(rows);
  const statusLabel = { CANCELLED: "Cancelled", COLLECTED: "Collected", PENDING: "Pending" };
  mount.innerHTML = `
    <div class="page-head"><div><span class="eyebrow">Cross-tabs</span><h1>Analyse Pivot</h1><p>Tableaux croisés dynamiques</p></div></div>
    <div class="grid pivot-grid">
      <div class="card table-wrap">
        <div class="card-pad" style="padding-bottom:0;"><div class="card-title">Gate Pass par société et statut</div></div>
        <table>
          <thead><tr><th>Company</th>${byCompany.statuses.map((s) => `<th class="num">${statusLabel[s]}</th>`).join("")}<th class="num">Grand Total</th></tr></thead>
          <tbody>
            ${byCompany.rows.map((r) => `<tr><td>${esc(r.company)}</td>${byCompany.statuses.map((s) => `<td class="num">${r.counts[s] || ""}</td>`).join("")}<td class="num" style="font-weight:700;">${r.total}</td></tr>`).join("")}
          </tbody>
          <tfoot><tr style="background:var(--surface-2);font-weight:700;"><td>Grand Total</td>${byCompany.statuses.map((s) => `<td class="num">${byCompany.grand[s]}</td>`).join("")}<td class="num">${byCompany.grandAll}</td></tr></tfoot>
        </table>
      </div>
      <div class="card table-wrap">
        <div class="card-pad" style="padding-bottom:0;"><div class="card-title">Gate Pass par collecteur</div></div>
        <table>
          <thead><tr><th>Row Labels</th><th class="num">Count of Gate Pass Number</th></tr></thead>
          <tbody>${byCollector.map((r) => `<tr><td>${esc(r.name)}</td><td class="num">${r.count}</td></tr>`).join("")}</tbody>
          <tfoot><tr style="background:var(--surface-2);font-weight:700;"><td>Grand Total</td><td class="num">${rows.length}</td></tr></tfoot>
        </table>
      </div>
    </div>
  `;
}
