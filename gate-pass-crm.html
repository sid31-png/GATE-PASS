<meta charset="UTF-8">
<title>RCH · Gate Pass CRM</title>
<style>
  :root {
    --paper: #fafafc;
    --surface: #ffffff;
    --surface-2: #f4f2f8;
    --ink: #181d27;
    --ink-2: #535862;
    --muted: #8d94a3;
    --border: rgba(24,29,39,.10);
    --border-strong: rgba(24,29,39,.20);
    --brand: #af1882;
    --brand-hover: #8f1468;
    --brand-soft: rgba(175,24,130,.10);
    --navy: #293d81;
    --navy-deep: #1c2a5e;
    --navy-light: #4258b3;
    --good: #0b7d0b;
    --warning-ink: #8a5b00;
    --warning-bg: #fde9bd;
    --serious: #c25a34;
    --serious-bg: #f8ddce;
    --critical: #d03b3b;
    --critical-bg: #fbdcdc;
    --good-bg: #d9f0d3;
    --cancelled-bg: #e7e7ee;
    --cancelled-ink: #5b5f6d;
    --cat-1: #af1882;
    --cat-2: #1baf7a;
    --cat-3: #4258b3;
    --cat-4: #eb6834;
    --grid: #e9e7f0;
    --shadow: 0 1px 2px rgba(24,29,39,.05), 0 8px 24px -12px rgba(24,29,39,.16);
    --sans: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e0f16;
      --surface: #171923;
      --surface-2: #1f2230;
      --ink: #f1f1f6;
      --ink-2: #c7c9d6;
      --muted: #90939f;
      --border: rgba(255,255,255,.10);
      --border-strong: rgba(255,255,255,.20);
      --brand: #e254a8;
      --brand-hover: #ef6bb8;
      --brand-soft: rgba(226,84,168,.16);
      --navy: #4258b3;
      --navy-deep: #14192b;
      --navy-light: #5f79d1;
      --good: #35b53b;
      --warning-ink: #f0c14b;
      --warning-bg: #3a3013;
      --serious: #e8875c;
      --serious-bg: #3a2115;
      --critical: #e8615f;
      --critical-bg: #3a1616;
      --good-bg: #123a17;
      --cancelled-bg: #262936;
      --cancelled-ink: #a9acb9;
      --cat-1: #e254a8;
      --cat-2: #199e70;
      --cat-3: #5f79d1;
      --cat-4: #d9642e;
      --grid: #262838;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0e0f16; --surface: #171923; --surface-2: #1f2230; --ink: #f1f1f6; --ink-2: #c7c9d6; --muted: #90939f;
    --border: rgba(255,255,255,.10); --border-strong: rgba(255,255,255,.20);
    --brand: #e254a8; --brand-hover: #ef6bb8; --brand-soft: rgba(226,84,168,.16);
    --navy: #4258b3; --navy-deep: #14192b; --navy-light: #5f79d1;
    --good: #35b53b; --warning-ink: #f0c14b; --warning-bg: #3a3013; --serious: #e8875c; --critical: #e8615f;
    --critical-bg: #3a1616; --good-bg: #123a17; --cancelled-bg: #262936; --cancelled-ink: #a9acb9;
    --cat-1: #e254a8; --cat-2: #199e70; --cat-3: #5f79d1; --cat-4: #d9642e; --grid: #262838;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --paper: #fafafc; --surface: #ffffff; --surface-2: #f4f2f8; --ink: #181d27; --ink-2: #535862; --muted: #8d94a3;
    --border: rgba(24,29,39,.10); --border-strong: rgba(24,29,39,.20);
    --brand: #af1882; --brand-hover: #8f1468; --brand-soft: rgba(175,24,130,.10);
    --navy: #293d81; --navy-deep: #1c2a5e; --navy-light: #4258b3;
    --good: #0b7d0b; --warning-ink: #8a5b00; --warning-bg: #fde9bd; --serious: #c25a34; --critical: #d03b3b;
    --critical-bg: #fbdcdc; --good-bg: #d9f0d3; --cancelled-bg: #e7e7ee; --cancelled-ink: #5b5f6d;
    --cat-1: #af1882; --cat-2: #1baf7a; --cat-3: #4258b3; --cat-4: #eb6834; --grid: #e9e7f0;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }
  ::selection { background: var(--brand-soft); }
  h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; margin: 0; font-weight: 700; }
  .tabular { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; }
  a { color: inherit; }

  .app { display: none; min-height: 100vh; }
  .app.authed { display: flex; }

  /* ---------- pre-dashboard login screen ---------- */
  .login-screen {
    display: none; min-height: 100vh; align-items: center; justify-content: center;
    padding: 40px 16px; background: linear-gradient(135deg, var(--navy-deep), var(--navy));
  }
  .login-screen.open { display: flex; }
  .login-wrap { width: 100%; max-width: 640px; }
  .login-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 28px; }
  .login-head img { height: 46px; width: auto; background: #fff; border-radius: 14px; padding: 10px 16px; box-shadow: var(--shadow); }
  .login-head h1 { margin-top: 18px; font-size: 22px; color: #fff; }
  .login-head p { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,.6); }
  .login-card { background: #fff; border-radius: 18px; padding: 26px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .login-profiles-group { margin-bottom: 20px; }
  .login-profiles-group:last-child { margin-bottom: 0; }
  .login-profiles-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .login-profiles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .login-profile-btn {
    all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 14px 10px; border-radius: 12px; border: 1px solid var(--border); text-align: center;
  }
  .login-profile-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
  .login-profile-avatar {
    width: 44px; height: 44px; border-radius: 100px; background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  }
  .login-profile-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .login-back { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--navy-light); margin-bottom: 16px; display: inline-block; }
  .login-selected { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .login-selected .login-profile-avatar { width: 48px; height: 48px; font-size: 15px; }
  .login-selected .name { font-weight: 700; color: var(--ink); font-size: 15px; }
  .login-selected .role { font-size: 12px; color: var(--ink-2); }
  .login-foot { margin-top: 22px; text-align: center; font-size: 11.5px; color: rgba(255,255,255,.4); }
  .login-demo-hint { margin-top: 14px; font-size: 11px; color: var(--muted); text-align: center; }

  /* ---------- sidebar (fixed light brand shell, both themes) ---------- */
  .sidebar {
    width: 240px; flex-shrink: 0;
    background: #ffffff; color: var(--ink);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    border-right: 1px solid rgba(24,29,39,.08);
    box-shadow: 1px 0 0 rgba(24,29,39,.02);
  }
  .sidebar-brand { padding: 22px 20px 16px; border-bottom: 1px solid #f1eef5; }
  .sidebar-brand img { display: block; height: 34px; width: auto; }
  .sidebar-brand .sub { margin-top: 8px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .current-user-box { padding: 12px 16px; border-bottom: 1px solid #f1eef5; }
  .current-user-box label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #9aa0ac; margin-bottom: 4px; }
  .current-user-box select { width: 100%; font-size: 12px; font-weight: 600; padding: 6px 8px; border-radius: 8px; border: 1px solid #e6e4ee; background: #fafafc; color: #181d27; }
  .current-user-box .role { margin-top: 6px; font-size: 10.5px; font-weight: 700; color: var(--brand); }
  .nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px;
    padding: 9px 12px 9px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: #6b7280;
    font-family: var(--sans); border-left: 3px solid transparent; transition: color .12s, background-color .12s;
  }
  .nav button:hover { background: var(--surface-2); color: var(--brand); }
  .nav button.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; border-left-color: var(--brand); }
  .nav button .n { font-size: 10.5px; opacity: .55; width: 14px; font-weight: 700; }
  .sidebar-foot { padding: 16px 20px 20px; font-size: 11px; color: var(--muted); border-top: 1px solid #f1eef5; }
  .sidebar-foot button {
    all: unset; cursor: pointer; font-size: 11px; color: var(--ink-2); text-decoration: underline;
    text-underline-offset: 2px;
  }
  .sidebar-foot button:hover { color: var(--brand); }

  /* ---------- main ---------- */
  .main { flex: 1; min-width: 0; padding: 28px 34px 60px; max-width: 1320px; }
  .view { display: none; }
  .view.active { display: block; }

  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .page-head h1 { font-size: 21px; color: var(--ink); }
  .page-head .eyebrow {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--brand); margin-bottom: 6px; display: block;
  }
  .page-head p { margin: 6px 0 0; color: var(--ink-2); font-size: 13px; }

  .btn {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
    border: 1px solid transparent; transition: background-color .12s, box-shadow .12s;
  }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 1px 2px rgba(175,24,130,.25); }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-ghost { border-color: var(--border-strong); color: var(--ink); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-success { background: var(--good); color: #fff; box-shadow: 0 1px 2px rgba(11,125,11,.25); }
  .btn-success:hover { filter: brightness(1.08); }
  .btn-danger { background: var(--critical); color: #fff; box-shadow: 0 1px 2px rgba(208,59,59,.25); }
  .btn-danger:hover { filter: brightness(1.08); }
  .btn-danger-ghost { border-color: rgba(208,59,59,.35); color: var(--critical); }
  .btn-danger-ghost:hover { background: var(--critical-bg); }
  .btn-link { all: unset; cursor: pointer; font-size: 12px; font-weight: 600; }
  .link-edit { color: var(--navy-light); }
  .link-warn { color: var(--warning-ink); }
  .link-danger { color: var(--critical); }
  .btn-link:hover { text-decoration: underline; text-underline-offset: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card-pad { padding: 18px 20px; }
  .card-title { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }

  .grid { display: grid; gap: 14px; }
  .kpi-row { grid-template-columns: repeat(6, 1fr); margin-bottom: 12px; }
  @media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .kpi .lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .kpi .val { font-size: 22px; font-weight: 700; margin-top: 6px; color: var(--ink); letter-spacing: -0.01em; }
  .kpi .val.good { color: var(--good); }
  .kpi .val.warn { color: var(--warning-ink); }
  .kpi .val.crit { color: var(--critical); }
  .kpi .val.accent { color: var(--brand); }
  .kpi .sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  /* ---------- hero band (branded stat moment) ---------- */
  .hero-band {
    background: linear-gradient(135deg, var(--navy-deep), var(--navy));
    border-radius: 16px; padding: 26px 28px; margin-bottom: 14px;
    box-shadow: 0 12px 30px -14px rgba(28,42,94,.55);
  }
  .hero-stats { display: flex; flex-wrap: wrap; gap: 22px 44px; }
  .hero-stat { min-width: 118px; }
  .hero-stat .lbl { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: rgba(255,255,255,.6); }
  .hero-stat .val { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: -0.02em; margin-top: 6px; }
  .hero-stat .val.t-good { color: #8fe3a4; }
  .hero-stat .val.t-warn { color: #ffd67e; }
  .hero-stat .val.t-crit { color: #ff9fb0; }
  .hero-stat .val.t-brand { color: #ff8fd0; }

  .charts-2 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .charts-2 { grid-template-columns: 1fr; } }
  .pivot-grid { grid-template-columns: 1.4fr 1fr; }
  @media (max-width: 900px) { .pivot-grid { grid-template-columns: 1fr; } }

  /* ---------- table ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-wide table { min-width: 640px; }
  thead th {
    text-align: left; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono-cell { font-variant-numeric: tabular-nums; }
  .empty-row td { text-align: center; padding: 34px; color: var(--muted); }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 100px;
    font-size: 11px; font-weight: 700; white-space: nowrap; font-family: var(--sans);
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill-good { background: var(--good-bg); color: var(--good); }
  .pill-warn { background: var(--warning-bg); color: var(--warning-ink); }
  .pill-crit { background: var(--critical-bg); color: var(--critical); }
  .pill-serious { background: var(--serious-bg); color: var(--serious); }
  .pill-mute { background: var(--cancelled-bg); color: var(--cancelled-ink); }
  .pill-info { background: rgba(66,88,179,.12); color: var(--navy-light); }
  .pill-brand { background: var(--brand-soft); color: var(--brand); }

  /* ---------- delivery / dispatch task cards ---------- */
  .section-title { font-size: 13px; font-weight: 700; color: var(--ink); margin: 22px 0 10px; }
  .section-title:first-child { margin-top: 0; }
  .task-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 6px; }
  .task-card { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .task-card .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .task-card .title-row .t { font-weight: 700; font-size: 13.5px; color: var(--ink); }
  .task-card .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .task-card .desc { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
  .task-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
  .info-box { background: var(--surface-2); border-radius: 8px; padding: 8px 11px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .danger-box { background: var(--critical-bg); border-radius: 8px; padding: 8px 11px; font-size: 12px; color: var(--critical); margin-top: 8px; }
  .empty-card { text-align: center; padding: 26px; color: var(--muted); font-size: 13px; }
  .chip-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 100px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); }
  .chip.active { background: var(--brand); color: #fff; }
  .btn-block { width: 100%; justify-content: center; }
  .field-select-card { max-width: 420px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input, .toolbar select, .field input, .field select, .field textarea {
    font-family: var(--sans); font-size: 13px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
  }
  .toolbar input:focus, .toolbar select:focus, .field input:focus, .field select:focus, .field textarea:focus {
    outline: 2px solid var(--brand-soft); border-color: var(--brand);
  }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar select { min-width: 150px; }

  .actions-cell { display: flex; gap: 12px; justify-content: flex-end; white-space: nowrap; }

  /* ---------- charts (svg) ---------- */
  .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 11.5px; color: var(--ink-2); }
  .chart-legend .item { display: flex; align-items: center; gap: 6px; }
  .chart-legend .swatch { width: 9px; height: 9px; border-radius: 2px; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: var(--ink); color: var(--paper);
    font-size: 11px; padding: 5px 8px; border-radius: 6px; opacity: 0;
    transition: opacity .1s; white-space: nowrap; z-index: 20; box-shadow: var(--shadow);
  }
  .svg-wrap { position: relative; }
  .bar-mark { transition: opacity .1s; }
  .bar-mark:hover { opacity: .82; cursor: pointer; }
  .dot-mark { cursor: pointer; }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(24,29,39,.5); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border-radius: 14px; border: 1px solid var(--border);
    padding: 22px 24px; box-shadow: 0 20px 60px -20px rgba(0,0,0,.4);
  }
  .modal h2 { font-size: 16px; margin-bottom: 4px; }
  .modal .kicker { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; }
  .field-readonly { padding: 8px 10px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .collect-box { background: var(--surface-2); border-radius: 8px; padding: 12px; margin-bottom: 13px; }
  .err-msg { color: var(--critical); font-size: 12px; margin: 4px 0 0; }

  .mobile-nav { display: none; }
  @media (max-width: 860px) {
    .sidebar { display: none; }
    .mobile-nav {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .mobile-nav button {
      all: unset; cursor: pointer; flex-shrink: 0; padding: 7px 13px; border-radius: 100px;
      font-size: 12.5px; background: var(--surface-2); color: var(--ink-2); font-weight: 500;
    }
    .mobile-nav button.active { background: var(--brand); color: #fff; }
    .main { padding: 18px 16px 50px; }
  }

  .footnote { margin-top: 26px; font-size: 11.5px; color: var(--muted); }
</style>

<div class="login-screen" id="loginScreen">
  <div class="login-wrap">
    <div class="login-head">
      <img id="loginLogo" alt="RCH">
      <h1>Gate Pass &amp; Delivery CRM</h1>
      <p>Select your profile to sign in</p>
    </div>
    <div class="login-card" id="loginCard"></div>
    <div class="login-foot">RCH Business Solutions · Access is restricted by role</div>
  </div>
</div>

<div class="app" id="appRoot">

/* ================= RBAC =================
   Role hierarchy (highest to lowest): CEO > SUPER_ADMIN > OPS_ADMIN > AM_LEAD
   > OPERATOR > AM > FIELD (no login) > UNASSIGNED. Mirrors src/lib/rbac.ts. */
function roleOf(e) {
  if (!e) return "UNASSIGNED";
  if (e.isCEO) return "CEO";
  if (e.isManager) return "SUPER_ADMIN";
  if (e.isOpsAdmin) return "OPS_ADMIN";
  if (e.isAMLead) return "AM_LEAD";
  if (e.isOnline) return "OPERATOR";
  if (e.isAM) return "AM";
  if (e.isField) return "FIELD";
  return "UNASSIGNED";
}
const ROLE_LABEL = {
  CEO: "CEO", SUPER_ADMIN: "Super Admin", OPS_ADMIN: "Operations Admin", OPERATOR: "Online Operator",
  AM_LEAD: "Account Manager Lead", AM: "Account Manager", FIELD: "Field Agent", UNASSIGNED: "Unassigned"
};
// CEO/SUPER_ADMIN bypass this table entirely (see `can` below).
// dispatch_field_assign = assigning/reassigning a field agent + instructions,
// and validating (completing) a delivery — exclusive to CEO/SUPER_ADMIN.
// update_field_status = relaying a field agent's own progress (started/
// blocked/resumed) — also open to Online Operators and Ops Admin.
const ROLE_PERMISSIONS = {
  CEO: [], SUPER_ADMIN: [],
  OPS_ADMIN: ["view_all_online_queue", "reassign_requests", "import_companies", "update_field_status"],
  AM_LEAD: ["view_all_am_requests", "create_service_request"],
  OPERATOR: ["update_field_status"],
  AM: ["create_service_request"],
  FIELD: [], UNASSIGNED: []
};
function can(e, permission) {
  const role = roleOf(e);
  if (role === "CEO" || role === "SUPER_ADMIN") return true;
  return ROLE_PERMISSIONS[role].includes(permission);
}
// Page-level access rules for the pre-dashboard route guard (mirrors
// src/lib/route-access.ts). CEO/SUPER_ADMIN are always implicitly allowed.
const VIEW_ACCESS_RULES = {
  dispatch: ["OPS_ADMIN", "OPERATOR"],
  "online-queue": ["OPS_ADMIN", "OPERATOR"],
  online: ["OPS_ADMIN", "OPERATOR"],
  "company-import": ["OPS_ADMIN"],
  "account-managers": ["OPS_ADMIN", "AM_LEAD", "AM"]
};
function isViewAllowed(id, role) {
  if (role === "CEO" || role === "SUPER_ADMIN") return true;
  const rule = VIEW_ACCESS_RULES[id];
  if (!rule) return true;
  return rule.includes(role);
}

/**
 * Determines which Online Operator a service request should be auto-assigned
 * to, applying the binome (AM <-> operator) rules: a company-level
 * AssignmentRule (e.g. any company containing "ABB" round-robins between
 * ALAA and TAHA) takes priority over the AM's default Partnership. Round-robin
 * fairness is derived from how many past requests already used the same
 * rule/partnership.
 */
function resolveOnlineOperator(companyId, amEmployeeId) {
  const company = companyId ? DB.companies.find((c) => c.id === companyId) : null;
  if (company) {
    const rules = DB.assignmentRules.filter((r) => r.active).sort((a, b) => b.priority - a.priority);
    const matched = rules.find((r) => company.name.toUpperCase().includes(r.matchValue.toUpperCase()));
    if (matched) {
      const priorCount = DB.serviceRequests.filter((r) => r.assignmentRuleId === matched.id).length;
      const operatorId = matched.operatorIds[priorCount % matched.operatorIds.length];
      return {
        operatorId, flaggedForManager: matched.flagManager, assignmentRuleId: matched.id, partnershipId: null,
        note: `Auto-assigned via rule "${matched.note || matched.matchValue}" (round-robin)`
      };
    }
  }
  const partnership = DB.partnerships.find((p) => p.amEmployeeId === amEmployeeId);
  if (partnership) {
    const priorCount = DB.serviceRequests.filter((r) => r.partnershipId === partnership.id).length;
    const operatorId = partnership.operatorIds[priorCount % partnership.operatorIds.length];
    return {
      operatorId, flaggedForManager: partnership.flagManager, assignmentRuleId: null, partnershipId: partnership.id,
      note: partnership.note || "Auto-assigned via the Account Manager's default partnership"
    };
  }
  return { operatorId: null, flaggedForManager: false, assignmentRuleId: null, partnershipId: null, note: "No partnership configured for this Account Manager — needs manual assignment." };
}

function computeKpis(rows, now = new Date()) {
  const total = rows.length;
  const collected = rows.filter((g) => g.status === "COLLECTED");
  const pending = rows.filter((g) => g.status === "PENDING");
  const cancelled = rows.filter((g) => g.status === "CANCELLED");
  const times = collected.map((g) => processingHours(g)).filter((h) => h !== null);
  const avg = times.length ? times.reduce((a, b) => a + b, 0) / times.length : 0;
  const fastest = times.length ? Math.min(...times) : null;
  const longest = times.length ? Math.max(...times) : null;

  const sod = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = (sod.getDay() + 6) % 7;
  const sow = new Date(sod); sow.setDate(sow.getDate() - dow);
  const som = new Date(now.getFullYear(), now.getMonth(), 1);
  const soy = new Date(now.getFullYear(), 0, 1);

  const cAt = (g) => new Date(g.collectionAt);
  return {
    total, collected: collected.length, pending: pending.length, cancelled: cancelled.length,
    collectionRate: total ? collected.length / total : 0,
    avgHours: avg, fastestHours: fastest, longestHours: longest,
    today: collected.filter((g) => cAt(g) >= sod).length,
    week: collected.filter((g) => cAt(g) >= sow).length,
    month: collected.filter((g) => cAt(g) >= som).length,
    year: collected.filter((g) => cAt(g) >= soy).length
  };
}
function computeStatusDistribution(rows) {
  return [
    { name: "Collected", value: rows.filter((g) => g.status === "COLLECTED").length, color: "var(--good)" },
    { name: "Pending", value: rows.filter((g) => g.status === "PENDING").length, color: "var(--warning-ink)" },
    { name: "Cancelled", value: rows.filter((g) => g.status === "CANCELLED").length, color: "var(--muted)" }
  ];
}
function seriesBuckets(rows, unit, count, now = new Date()) {
  const out = [];
  if (unit === "day") {
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (count - 1));
    for (let i = 0; i < count; i++) {
      const d0 = new Date(start); d0.setDate(d0.getDate() + i);
      const d1 = new Date(d0); d1.setDate(d1.getDate() + 1);
      out.push(bucket(rows, d0, d1, d0.toLocaleDateString(undefined, { month: "short", day: "2-digit" })));
    }
  } else if (unit === "week") {
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const dow = (today.getDay() + 6) % 7;
    const thisWeek = new Date(today); thisWeek.setDate(thisWeek.getDate() - dow);
    const start = new Date(thisWeek); start.setDate(start.getDate() - 7 * (count - 1));
    for (let i = 0; i < count; i++) {
      const d0 = new Date(start); d0.setDate(d0.getDate() + i * 7);
      const d1 = new Date(d0); d1.setDate(d1.getDate() + 7);
      out.push(bucket(rows, d0, d1, d0.toLocaleDateString(undefined, { month: "short", day: "2-digit" })));
    }
  } else {
    const start = new Date(now.getFullYear(), now.getMonth() - (count - 1), 1);
    for (let i = 0; i < count; i++) {
      const d0 = new Date(start.getFullYear(), start.getMonth() + i, 1);
      const d1 = new Date(start.getFullYear(), start.getMonth() + i + 1, 1);
      out.push(bucket(rows, d0, d1, d0.toLocaleDateString(undefined, { month: "short", year: "2-digit" })));
    }
  }
  return out;
}
function bucket(rows, d0, d1, label) {
  const submitted = rows.filter((g) => { const d = new Date(g.submissionAt); return d >= d0 && d < d1; }).length;
  const collected = rows.filter((g) => g.collectionAt && (() => { const d = new Date(g.collectionAt); return d >= d0 && d < d1; })()).length;
  return { label, submitted, collected };
}
function computeCollectorPerformance(rows) {
  const collected = rows.filter((g) => g.status === "COLLECTED" && g.collectorId);
  const byC = new Map();
  for (const g of collected) {
    const name = collectorName(g.collectorId);
    const h = processingHours(g);
    if (!byC.has(name)) byC.set(name, []);
    byC.get(name).push(h);
  }
  const total = collected.length;
  const rowsOut = [...byC.entries()].map(([name, times]) => ({
    name, totalCollected: times.length,
    avgHours: times.reduce((a, b) => a + b, 0) / times.length,
    fastestHours: Math.min(...times), longestHours: Math.max(...times),
    share: total ? times.length / total : 0
  }));
  rowsOut.sort((a, b) => b.totalCollected - a.totalCollected);
  return rowsOut.map((r, i) => ({ ...r, rank: i + 1 }));
}
function computePivotByCompanyStatus(rows) {
  const companies = [...new Set(rows.map((g) => companyName(g.companyId)))].sort();
  const statuses = ["CANCELLED", "COLLECTED", "PENDING"];
  const out = companies.map((company) => {
    const counts = {};
    let total = 0;
    for (const s of statuses) {
      const n = rows.filter((g) => companyName(g.companyId) === company && g.status === s).length;
      counts[s] = n; total += n;
    }
    return { company, counts, total };
  });
  const grand = {};
  for (const s of statuses) grand[s] = rows.filter((g) => g.status === s).length;
  return { rows: out, statuses, grand, grandAll: rows.length };
}
function computePivotByCollector(rows) {
  const names = [...new Set(rows.map((g) => collectorName(g.collectorId) || "(unassigned)"))].sort();
  const out = names.map((name) => ({
    name, count: rows.filter((g) => (collectorName(g.collectorId) || "(unassigned)") === name).length
  }));
  out.sort((a, b) => b.count - a.count);
  return out;
}
function computePivotByLocationStatus(rows) {
  const locations = [...new Set(rows.map((g) => g.location))].sort();
  const statuses = ["CANCELLED", "COLLECTED", "PENDING"];
  const out = locations.map((location) => {
    const counts = {};
    let total = 0;
    for (const s of statuses) {
      const n = rows.filter((g) => g.location === location && g.status === s).length;
      counts[s] = n; total += n;
    }
    return { location, counts, total };
  });
  const grand = {};
  for (const s of statuses) grand[s] = rows.filter((g) => g.status === s).length;
  return { rows: out, statuses, grand, grandAll: rows.length };
}

/* ================= tiny chart toolkit (inline SVG) ================= */
function svgEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function attachTooltip(container) {
  const tip = document.createElement("div");
  tip.className = "chart-tooltip";
  container.appendChild(tip);
  return {
    show(x, y, html) { tip.innerHTML = html; tip.style.left = x + 12 + "px"; tip.style.top = y - 8 + "px"; tip.style.opacity = "1"; },
    hide() { tip.style.opacity = "0"; }
  };
}

// Two-series (submitted/collected) vertical bar or comparison bar chart
function renderCompareBars(mount, data) {
  mount.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className = "svg-wrap"; mount.appendChild(wrap);
  const w = 420, h = 200, padL = 34, padB = 24, padT = 26, padR = 14;
  const max = Math.max(1, ...data.map((d) => d.value));
  const bw = (w - padL - padR) / data.length;
  const svg = svgEl("svg", { viewBox: `0 0 ${w} ${h}`, width: "100%", height: "220", role: "img", "aria-label": "Bar chart" });
  const steps = Math.min(4, Math.max(1, Math.round(max)));
  for (let i = 0; i <= steps; i++) {
    const y = padT + (h - padT - padB) * (1 - i / steps);
    svg.appendChild(svgEl("line", { x1: padL, x2: w - padR, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }));
    const t = svgEl("text", { x: padL - 8, y: y + 3, "text-anchor": "end", "font-size": 9, fill: "var(--muted)" });
    t.textContent = Math.round(max * (i / steps)); svg.appendChild(t);
  }
  const tip = attachTooltip(wrap);
  data.forEach((d, i) => {
    const barW = bw * 0.46;
    const x = padL + bw * i + (bw - barW) / 2;
    const bh = (h - padT - padB) * (d.value / max);
    const y = h - padB - bh;
    const rect = svgEl("rect", { x, y, width: barW, height: Math.max(bh,1), rx: 4, fill: d.color, class: "bar-mark" });
    rect.addEventListener("mousemove", (e) => {
      const r = wrap.getBoundingClientRect();
      tip.show(e.clientX - r.left, e.clientY - r.top, `<b>${esc(d.label)}</b>: ${d.value}`);
    });
    rect.addEventListener("mouseleave", () => tip.hide());
    svg.appendChild(rect);
    const lbl = svgEl("text", { x: x + barW / 2, y: h - padB + 14, "text-anchor": "middle", "font-size": 10, fill: "var(--ink-2)" });
    lbl.textContent = d.label; svg.appendChild(lbl);
    const val = svgEl("text", { x: x + barW / 2, y: y - 6, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 700 });
    val.textContent = d.value; svg.appendChild(val);
  });
  wrap.appendChild(svg);
}

// donut chart for status distribution
function renderDonut(mount, data) {
  mount.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className = "svg-wrap"; mount.appendChild(wrap);
  const size = 180, r = 62, stroke = 22, cx = size / 2, cy = size / 2;
  const total = data.reduce((a, b) => a + b.value, 0) || 1;
  const circumf = 2 * Math.PI * r;
  const svg = svgEl("svg", { viewBox: `0 0 ${size} ${size}`, width: "180", height: "180" });
  let offset = 0;
  const tip = attachTooltip(wrap);
  data.forEach((d) => {
    const frac = d.value / total;
    const dash = Math.max(frac * circumf - (frac > 0 ? 2 : 0), 0);
    const circle = svgEl("circle", {
      cx, cy, r, fill: "none", stroke: d.color, "stroke-width": stroke,
      "stroke-dasharray": `${dash} ${circumf - dash}`,
      "stroke-dashoffset": -offset, transform: `rotate(-90 ${cx} ${cy})`, "stroke-linecap": "round", class: "bar-mark"
    });
    circle.addEventListener("mousemove", (e) => {
      const r2 = wrap.getBoundingClientRect();
      tip.show(e.clientX - r2.left, e.clientY - r2.top, `<b>${esc(d.name)}</b>: ${d.value} (${(frac * 100).toFixed(0)}%)`);
    });
    circle.addEventListener("mouseleave", () => tip.hide());
    svg.appendChild(circle);
    offset += frac * circumf;
  });
  const centerVal = svgEl("text", { x: cx, y: cy - 2, "text-anchor": "middle", "font-size": 20, "font-weight": 800, fill: "var(--ink)" });
  centerVal.textContent = total;
  const centerLbl = svgEl("text", { x: cx, y: cy + 14, "text-anchor": "middle", "font-size": 9, fill: "var(--muted)" });
  centerLbl.textContent = "total";
  svg.appendChild(centerVal); svg.appendChild(centerLbl);
  wrap.appendChild(svg);
  const legend = document.createElement("div"); legend.className = "chart-legend";
  legend.innerHTML = data.map((d) => `<span class="item"><span class="swatch" style="background:${d.color}"></span>${esc(d.name)} · ${d.value}</span>`).join("");
  mount.appendChild(legend);
}

// two-line evolution chart (submitted vs collected)
function renderLineSeries(mount, data) {
  mount.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className = "svg-wrap"; mount.appendChild(wrap);
  const w = 760, h = 220, padL = 30, padR = 14, padT = 12, padB = 26;
  const maxV = Math.max(1, ...data.map((d) => Math.max(d.submitted, d.collected)));
  const n = data.length;
  const x = (i) => padL + (n > 1 ? (w - padL - padR) * (i / (n - 1)) : 0);
  const y = (v) => padT + (h - padT - padB) * (1 - v / maxV);
  const svg = svgEl("svg", { viewBox: `0 0 ${w} ${h}`, width: "100%", height: "230" });
  const steps = Math.min(4, Math.max(1, Math.round(maxV)));
  for (let i = 0; i <= steps; i++) {
    const yy = padT + (h - padT - padB) * (1 - i / steps);
    svg.appendChild(svgEl("line", { x1: padL, x2: w - padR, y1: yy, y2: yy, stroke: "var(--grid)", "stroke-width": 1 }));
    const t = svgEl("text", { x: padL - 6, y: yy + 3, "text-anchor": "end", "font-size": 9, fill: "var(--muted)" });
    t.textContent = Math.round(maxV * (i / steps)); svg.appendChild(t);
  }
  const tickEvery = Math.max(1, Math.ceil(n / 7));
  data.forEach((d, i) => {
    if (i % tickEvery === 0 || i === n - 1) {
      const t = svgEl("text", { x: x(i), y: h - padB + 14, "text-anchor": "middle", "font-size": 8.5, fill: "var(--muted)" });
      t.textContent = d.label; svg.appendChild(t);
    }
  });
  function line(key, color) {
    const pts = data.map((d, i) => `${x(i)},${y(d[key])}`).join(" ");
    svg.appendChild(svgEl("polyline", { points: pts, fill: "none", stroke: color, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));
  }
  line("submitted", "var(--navy-light)");
  line("collected", "var(--good)");
  const tip = attachTooltip(wrap);
  data.forEach((d, i) => {
    ["submitted", "collected"].forEach((key) => {
      const color = key === "submitted" ? "var(--navy-light)" : "var(--good)";
      const c = svgEl("circle", { cx: x(i), cy: y(d[key]), r: 3, fill: color, class: "dot-mark" });
      c.addEventListener("mousemove", (e) => {
        const r = wrap.getBoundingClientRect();
        tip.show(e.clientX - r.left, e.clientY - r.top, `<b>${esc(d.label)}</b><br>Submitted: ${d.submitted} · Collected: ${d.collected}`);
      });
      c.addEventListener("mouseleave", () => tip.hide());
      svg.appendChild(c);
    });
  });
  wrap.appendChild(svg);
  const legend = document.createElement("div"); legend.className = "chart-legend";
  legend.innerHTML = `<span class="item"><span class="swatch" style="background:var(--navy-light)"></span>Submitted</span><span class="item"><span class="swatch" style="background:var(--good)"></span>Collected</span>`;
  mount.appendChild(legend);
}

// horizontal categorical bars (collector performance)
function renderHBars(mount, rows) {
  mount.innerHTML = "";
  const colors = ["var(--cat-1)", "var(--cat-2)", "var(--cat-3)", "var(--cat-4)"];
  const wrap = document.createElement("div"); wrap.className = "svg-wrap"; mount.appendChild(wrap);
  const w = 640, rowH = 34, padL = 110, padR = 40, padT = 6;
  const h = padT + rows.length * rowH + 6;
  const max = Math.max(1, ...rows.map((r) => r.totalCollected));
  const svg = svgEl("svg", { viewBox: `0 0 ${w} ${h}`, width: "100%", height: h });
  const tip = attachTooltip(wrap);
  rows.forEach((r, i) => {
    const y = padT + i * rowH;
    const bw = (w - padL - padR) * (r.totalCollected / max);
    const label = svgEl("text", { x: padL - 10, y: y + rowH / 2 + 4, "text-anchor": "end", "font-size": 11, fill: "var(--ink-2)" });
    label.textContent = r.name; svg.appendChild(label);
    const rect = svgEl("rect", { x: padL, y: y + 6, width: Math.max(bw,2), height: rowH - 14, rx: 4, fill: colors[i % colors.length], class: "bar-mark" });
    rect.addEventListener("mousemove", (e) => {
      const rc = wrap.getBoundingClientRect();
      tip.show(e.clientX - rc.left, e.clientY - rc.top, `<b>${esc(r.name)}</b>: ${r.totalCollected} collected`);
    });
    rect.addEventListener("mouseleave", () => tip.hide());
    svg.appendChild(rect);
    const val = svgEl("text", { x: padL + bw + 8, y: y + rowH / 2 + 4, "font-size": 11, fill: "var(--ink)", "font-weight": 700 });
    val.textContent = r.totalCollected; svg.appendChild(val);
  });
  wrap.appendChild(svg);
}

const NAV_ITEMS = [
  { id: "dashboard", label: "Dashboard", n: "01" },
  { id: "tracker", label: "Gate Pass Tracker", n: "02" },
  { id: "pending", label: "Pending", n: "03" },
  { id: "collectors", label: "Collector Performance", n: "04" },
  { id: "companies", label: "Companies", n: "05" },
  { id: "analytics", label: "Analytics", n: "06" },
  { id: "account-managers", label: "Account Managers", n: "07" },
  { id: "online-queue", label: "Online Queue", n: "08" },
  { id: "company-import", label: "Import Companies", n: "09" },
  { id: "dispatch", label: "Dispatch", n: "10" },
  { id: "online", label: "Online Team", n: "11" },
  { id: "field", label: "Field Team", n: "12" },
  { id: "deliveries", label: "Deliveries", n: "13" }
];
let currentView = "dashboard";

/* ================= pre-dashboard login (client-side only) =================
   SECURITY NOTE: this is a static, self-contained HTML file with no server —
   there is nothing to keep the password check confidential. Anyone can open
   dev tools or view-source and read SEED_EMPLOYEES.password directly, or just
   flip `authedEmployeeId` in localStorage. This screen exists to mirror the
   Next.js app's real (server-verified, hashed-password, HMAC-session) login
   UX for demoing the profile-and-role flow, NOT to provide actual security.
   Treat this file as trusted-users-only, same as before this change. */
const AUTH_STORAGE_KEY = "gatepass-authed-employee-id";
let currentEmployeeId = (function () {
  try {
    const raw = localStorage.getItem(AUTH_STORAGE_KEY);
    return raw ? Number(raw) : null;
  } catch (e) { return null; }
})();
let loginSelectedId = null;
function currentEmployee() { return DB.employees.find((e) => e.id === currentEmployeeId) || null; }
function currentRole() { return roleOf(currentEmployee()); }

function renderLoginCard() {
  const card = document.getElementById("loginCard");
  const loginable = DB.employees.filter((e) => e.password);
  if (!loginSelectedId) {
    const groups = ["CEO", "SUPER_ADMIN", "OPS_ADMIN", "AM_LEAD", "AM", "OPERATOR"]
      .map((role) => ({ role, list: loginable.filter((e) => roleOf(e) === role) }))
      .filter((g) => g.list.length);
    card.innerHTML = groups.map((g) => `
      <div class="login-profiles-group">
        <div class="login-profiles-label">${ROLE_LABEL[g.role]}</div>
        <div class="login-profiles-grid">
          ${g.list.map((e) => `
            <button class="login-profile-btn" data-id="${e.id}">
              <span class="login-profile-avatar">${esc(e.name.slice(0, 2).toUpperCase())}</span>
              <span class="login-profile-name">${esc(e.name)}</span>
            </button>
          `).join("")}
        </div>
      </div>
    `).join("");
    card.querySelectorAll("[data-id]").forEach((btn) => {
      btn.addEventListener("click", () => { loginSelectedId = Number(btn.getAttribute("data-id")); renderLoginCard(); });
    });
    return;
  }
  const e = DB.employees.find((x) => x.id === loginSelectedId);
  card.innerHTML = `
    <button class="login-back" id="loginBackBtn">← Choose a different profile</button>
    <div class="login-selected">
      <span class="login-profile-avatar">${esc(e.name.slice(0, 2).toUpperCase())}</span>
      <div><div class="name">${esc(e.name)}</div><div class="role">${ROLE_LABEL[roleOf(e)]}</div></div>
    </div>
    <form id="loginForm">
      <div class="field"><label>Password</label><input type="password" id="loginPassword" autofocus placeholder="Enter your password"></div>
      <p class="err-msg" id="loginErr" style="display:none;"></p>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;">Sign in</button>
    </form>
    <div class="login-demo-hint">Demo password: ${esc(e.name.replace(/[^a-zA-Z]/g, ""))}@Rch2026</div>
  `;
  document.getElementById("loginBackBtn").addEventListener("click", () => { loginSelectedId = null; renderLoginCard(); });
  document.getElementById("loginForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const pw = document.getElementById("loginPassword").value;
    if (pw !== e.password) { showErr("loginErr", "Invalid profile or password."); return; }
    currentEmployeeId = e.id;
    try { localStorage.setItem(AUTH_STORAGE_KEY, String(e.id)); } catch (err) { /* ignore */ }
    loginSelectedId = null;
    enterApp();
  });
}
function enterApp() {
  document.getElementById("loginScreen").classList.remove("open");
  document.getElementById("appRoot").classList.add("authed");
  setupNav();
  if (!isViewAllowed(currentView, currentRole())) currentView = "dashboard";
  switchView(currentView);
}
function logout() {
  currentEmployeeId = null;
  try { localStorage.removeItem(AUTH_STORAGE_KEY); } catch (err) { /* ignore */ }
  document.getElementById("appRoot").classList.remove("authed");
  document.getElementById("loginScreen").classList.add("open");
  renderLoginCard();
}

function setupNav() {
  const role = currentRole();
  const visibleItems = NAV_ITEMS.filter((it) => isViewAllowed(it.id, role));
  const nav = document.getElementById("nav");
  nav.innerHTML = visibleItems.map((it) => `<button data-view="${it.id}"><span class="n">${it.n}</span>${esc(it.label)}</button>`).join("");
  const mnav = document.getElementById("mobileNav");
  mnav.innerHTML = visibleItems.map((it) => `<button data-view="${it.id}">${esc(it.label)}</button>`).join("");
  document.querySelectorAll("[data-view]").forEach((btn) => {
    btn.addEventListener("click", () => switchView(btn.getAttribute("data-view")));
  });
  document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("active", b.getAttribute("data-view") === currentView));
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Reset all data back to the original 30 seeded gate passes? Local edits will be lost.")) resetState();
  });
  const me = currentEmployee();
  document.getElementById("currentUserName").textContent = me ? me.name : "—";
  document.getElementById("currentUserRole").textContent = ROLE_LABEL[role];
  document.getElementById("logoutBtn").onclick = logout;
}
function switchView(id) {
  const role = currentRole();
  const banner = document.getElementById("accessDeniedBanner");
  if (!isViewAllowed(id, role)) {
    banner.style.display = "block";
    banner.textContent = `🔒 Access restricted — your role doesn't have permission to view "${id}".`;
    id = "dashboard";
  } else {
    banner.style.display = "none";
  }
  currentView = id;
  document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
  document.getElementById("view-" + id).classList.add("active");
  document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("active", b.getAttribute("data-view") === id));
  renderView(id);
}

function renderView(id) {
  if (id === "dashboard") renderDashboard();
  else if (id === "tracker") renderTracker();
  else if (id === "pending") renderPending();
  else if (id === "collectors") renderCollectors();
  else if (id === "companies") renderCompanies();
  else if (id === "analytics") renderAnalytics();
  else if (id === "account-managers") renderAccountManagers();
  else if (id === "online-queue") renderOnlineQueue();
  else if (id === "company-import") renderCompanyImport();
  else if (id === "dispatch") renderDispatch();
  else if (id === "online") renderOnline();
  else if (id === "field") renderField();

function filteredGatePasses() {
  const f = trackerFilters;
  return DB.gatePasses
    .slice()
    .sort((a, b) => new Date(b.submissionAt) - new Date(a.submissionAt))
    .filter((g) => {
      if (f.status && g.status !== f.status) return false;
      if (f.companyId && String(g.companyId) !== String(f.companyId)) return false;
      if (f.collectorId && String(g.collectorId || "") !== String(f.collectorId)) return false;
      if (f.location && g.location !== f.location) return false;
      if (f.search) {
        const hay = `${g.number} ${companyName(g.companyId)} ${g.submittedBy}`.toLowerCase();
        if (!hay.includes(f.search.toLowerCase())) return false;
      }
      return true;
    });
}
function renderTrackerBody() {
  const rows = filteredGatePasses();
  const p = document.querySelector("#view-tracker .page-head p");
  if (p) p.textContent = `${rows.length} of ${DB.gatePasses.length} gate passes`;
  const body = document.getElementById("trackerBody");
  if (!rows.length) { body.innerHTML = `<tr class="empty-row"><td colspan="14">No gate passes match these filters.</td></tr>`; return; }
  body.innerHTML = rows.map((g) => {
    const hours = processingHours(g);
    return `<tr>
      <td class="mono-cell">${esc(g.number)}</td>
      <td>${esc(companyName(g.companyId))}</td>
      <td>${esc(g.location)}</td>
      <td>${esc(g.gatePassType)}</td>
      <td>${esc(g.requestType)}</td>
      <td>${esc(g.passCategory)}</td>
      <td class="mono-cell">${fmtDateTime(g.submissionAt)}</td>
      <td>${esc(collectorName(g.collectorId) || "—")}</td>
      <td class="mono-cell">${fmtDateTime(g.collectionAt)}</td>
      <td>${pillFor(g.status)}</td>
      <td>${pillFor(delayCategory(g))}</td>
      <td class="num">${hours !== null ? formatDuration(hours) : "—"}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);">${esc(g.remarks || "")}</td>
      <td><div class="actions-cell">
        <button class="btn-link link-edit" data-act="edit" data-id="${g.id}">Edit</button>
        ${g.status === "PENDING" ? `<button class="btn-link link-warn" data-act="cancel" data-id="${g.id}">Cancel</button>` : ""}
        <button class="btn-link link-danger" data-act="delete" data-id="${g.id}">Delete</button>
      </div></td>
    </tr>`;
  }).join("");
  body.querySelectorAll("[data-act]").forEach((btn) => {
    const id = Number(btn.getAttribute("data-id"));
    const act = btn.getAttribute("data-act");
    btn.addEventListener("click", () => {
      if (act === "edit") openGatePassModal(id);
      else if (act === "cancel") cancelGatePass(id);
      else if (act === "delete") deleteGatePass(id);
    });
  });
}
function cancelGatePass(id) {
  const remarks = prompt("Reason for cancellation (optional):") || null;
  const gp = DB.gatePasses.find((g) => g.id === id);
  gp.status = "CANCELLED"; gp.remarks = remarks;
  saveState(); renderAll();
}
function deleteGatePass(id) {
  if (!confirm("Delete this gate pass? This cannot be undone.")) return;
  DB.gatePasses = DB.gatePasses.filter((g) => g.id !== id);
  saveState(); renderAll();
}

            </div></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
  document.getElementById("btnNewCompany").addEventListener("click", () => openCompanyModal(null));

    const id = Number(btn.getAttribute("data-id"));
    const act = btn.getAttribute("data-coact");
    btn.addEventListener("click", () => {

let deliveryFilter = "ALL";
function renderDeliveries() {
  const mount = document.getElementById("view-deliveries");
  const tasks = DB.deliveryTasks
    .filter((t) => t.stage === "COMPLETED" || t.stage === "BLOCKED")
    .slice()
    .sort((a, b) => new Date(b.completedAt || b.createdAt) - new Date(a.completedAt || a.createdAt));
  const completed = tasks.filter((t) => t.stage === "COMPLETED");
  const blocked = tasks.filter((t) => t.stage === "BLOCKED");
  const durations = completed.filter((t) => t.startedAt && t.completedAt).map((t) => (new Date(t.completedAt) - new Date(t.startedAt)) / 36e5);
  const avgHours = durations.length ? durations.reduce((a, b) => a + b, 0) / durations.length : null;
  const rows = tasks.filter((t) => (deliveryFilter === "ALL" ? true : t.stage === deliveryFilter));
  mount.innerHTML = `

      <div><span class="eyebrow">Delivery tracking</span><h1>Delivery Tracking</h1><p>History of completed and blocked missions</p></div>

      ${kpiTile("Completed", completed.length, "", "good")}
      ${kpiTile("Currently Blocked", blocked.length, "", "crit")}
      ${kpiTile("Avg. Turnaround", avgHours !== null ? `${avgHours.toFixed(1)} h` : "—", "from start to completion", "accent")}
    </div>
    <div class="chip-row">
      <button class="chip ${deliveryFilter === "ALL" ? "active" : ""}" data-filter="ALL">All</button>
      <button class="chip ${deliveryFilter === "COMPLETED" ? "active" : ""}" data-filter="COMPLETED">Completed</button>
      <button class="chip ${deliveryFilter === "BLOCKED" ? "active" : ""}" data-filter="BLOCKED">Blocked</button>
    </div>
    <div class="card table-wrap table-wide">
      <table>
        <thead><tr><th>Task</th><th>Company / Gate Pass</th><th>Agent</th><th>Date</th><th>Time</th><th>Duration</th><th>Status</th></tr></thead>

          ${rows.map((t) => {

/* ================= company import (CSV) ================= */
// The self-contained HTML build has no bundler, so binary .xlsx parsing isn't
// practical here — export the allocation sheet as CSV first (one AM name per
// column header, company names down the rows). The Next.js app's Import
// Companies page accepts the original .xlsx directly.
function parseAllocationCSV(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim().length);
  if (!lines.length) return [];
  const splitRow = (line) => line.split(",").map((c) => c.trim().replace(/^"|"$/g, ""));
  const headers = splitRow(lines[0]);
  const columns = headers.filter((h) => h).map((h) => ({ amRawName: h, companies: [] }));
  for (const line of lines.slice(1)) {
    const cells = splitRow(line);
    headers.forEach((h, i) => {
      if (!h) return;
      const val = (cells[i] || "").trim();
      if (val) columns.find((c) => c.amRawName === h)?.companies.push(val);
    });
  }
  return columns;
}
function normalizeAMName(raw) {
  const stripped = raw.replace(/\s*-\s*RCHBS\s*$/i, "").trim();
  const aliases = { GABI: "Gabriela", GABRIELA: "Gabriela", ELENA: "ELENA" };
  const upper = stripped.toUpperCase();
  if (aliases[upper]) return aliases[upper];
  return stripped.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
}
function runCompanyImport(csvText, dryRun) {
  const columns = parseAllocationCSV(csvText);
  const amEmployees = DB.employees.filter((e) => e.isAM);
  const amByUpper = new Map(amEmployees.map((e) => [e.name.toUpperCase(), e]));
  const companyByUpper = new Map(DB.companies.map((c) => [c.name.toUpperCase(), c]));
  const results = [];
  let totalCreated = 0, totalLinked = 0;

  for (const col of columns) {
    const normalized = normalizeAMName(col.amRawName);
    const employee = amByUpper.get(normalized.toUpperCase()) || amByUpper.get(col.amRawName.toUpperCase());
    if (!employee) {
      results.push({ amRawName: col.amRawName, matchedEmployee: null, companiesFound: col.companies.length, toCreate: 0, toLink: 0, alreadyLinked: 0 });
      continue;
    }
    let toCreate = 0, toLink = 0, alreadyLinked = 0;
    for (const name of col.companies) {
      const key = name.toUpperCase();
      const existing = companyByUpper.get(key);
      if (existing) {
        if (existing.accountManagerId === employee.id) {
          alreadyLinked++;
        } else {
          toLink++;
          if (!dryRun) existing.accountManagerId = employee.id;
        }
      } else {
        toCreate++;
        if (!dryRun) {
          const created = { id: DB.nextIds.company++, name, sector: null, contact: null, phone: null, email: null, notes: null, accountManagerId: employee.id };
          DB.companies.push(created);
          companyByUpper.set(key, created);
        } else {
          companyByUpper.set(key, { id: -1, name, accountManagerId: employee.id });
        }
      }
    }
    totalCreated += toCreate; totalLinked += toLink;
    results.push({ amRawName: col.amRawName, matchedEmployee: employee.name, companiesFound: col.companies.length, toCreate, toLink, alreadyLinked });
  }
  if (!dryRun) saveState();
  return { dryRun, totalCompanies: columns.reduce((s, c) => s + c.companies.length, 0), totalCreated, totalLinked, columns: results };
}
function companyImportSummaryTable(summary) {
  return `
    <div class="card table-wrap">
      <table>
        <thead><tr><th>Column</th><th>Matched Employee</th><th>Companies</th><th>New</th><th>Re-linked</th><th>Already linked</th></tr></thead>
        <tbody>
          ${summary.columns.map((c) => `<tr style="${!c.matchedEmployee ? "background:var(--critical-bg);" : ""}">
            <td style="font-weight:600;">${esc(c.amRawName)}</td>
            <td>${c.matchedEmployee ? esc(c.matchedEmployee) : `<span style="color:var(--critical);">No matching Account Manager — skipped</span>`}</td>
            <td>${c.companiesFound}</td><td>${c.toCreate}</td><td>${c.toLink}</td><td>${c.alreadyLinked}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}
function renderCompanyImport() {
  const mount = document.getElementById("view-company-import");
  const me = currentEmployee();
  if (!can(me, "import_companies")) {
    mount.innerHTML = `
      <div class="page-head"><div><span class="eyebrow">Import Companies</span><h1>Import Companies</h1></div></div>
      <div class="card card-pad" style="max-width:460px;">
        🔒 Access restricted to the Operations Admin, Super Admin, and CEO.
      </div>
    `;
    return;
  }
  mount.innerHTML = `
    <div class="page-head">
      <div><span class="eyebrow">Import Companies</span><h1>Import Companies</h1>
      <p>Paste or upload the AM allocation as CSV (one Account Manager name per column header, company names down the rows)</p></div>
    </div>
    <div class="card card-pad" style="max-width:600px;margin-bottom:20px;">
      <div class="field"><label>CSV file</label><input type="file" id="ciFile" accept=".csv,.txt"></div>
      <div class="field"><label>…or paste CSV text</label><textarea id="ciText" rows="6" placeholder="Violetta,Abegail,Vongai&#10;ABB AG,AL HAMAD TRADING,ACTIVE EVENTS"></textarea></div>
      <p class="err-msg" id="ciErr" style="display:none;"></p>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button type="button" class="btn btn-ghost" id="ciPreviewBtn">Preview</button>
        <button type="button" class="btn btn-primary" id="ciApplyBtn" disabled>Apply Import</button>
      </div>
    </div>
    <div id="ciResults"></div>
  `;
  const fileInput = document.getElementById("ciFile");
  const textArea = document.getElementById("ciText");
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { textArea.value = String(reader.result || ""); };
    reader.readAsText(file);
  });
  let lastPreview = null;
  document.getElementById("ciPreviewBtn").addEventListener("click", () => {
    const text = textArea.value.trim();
    if (!text) { showErr("ciErr", "Provide a CSV file or paste CSV text first."); return; }
    document.getElementById("ciErr").style.display = "none";
    lastPreview = runCompanyImport(text, true);
    document.getElementById("ciApplyBtn").disabled = false;
    document.getElementById("ciResults").innerHTML = `
      <h2 style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;">Preview — ${lastPreview.totalCompanies} companies, ${lastPreview.totalCreated} new, ${lastPreview.totalLinked} re-linked</h2>
      ${companyImportSummaryTable(lastPreview)}
    `;
  });
  document.getElementById("ciApplyBtn").addEventListener("click", () => {
    const text = textArea.value.trim();
    if (!text) return;
    const applied = runCompanyImport(text, false);
    document.getElementById("ciApplyBtn").disabled = true;
    document.getElementById("ciResults").innerHTML = `
      <h2 style="font-size:13px;font-weight:700;color:var(--good);margin-bottom:10px;">✓ Import applied — ${applied.totalCreated} companies created, ${applied.totalLinked} re-linked to a new AM</h2>
      ${companyImportSummaryTable(applied)}
    `;
  });
}
